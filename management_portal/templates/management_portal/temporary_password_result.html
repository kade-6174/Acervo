{% extends "base.html" %}

{% block title %}一時パスワード — {{ acervo_site_name }}{% endblock %}

{% block content %}
  <section class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <p class="text-uppercase text-secondary fw-semibold mb-2">Management</p>
        <h1 class="h2 mb-3">{{ operation_label }}</h1>
        <div class="alert alert-warning" role="alert">
          <p class="mb-3"><strong>{{ target.username }}</strong> の一時パスワードです。この画面を閉じると再表示できません。安全な方法で本人に渡してください。</p>
          <p class="mb-0"><code class="user-select-all fs-5">{{ temporary_password }}</code></p>
        </div>
        <p><a class="btn btn-dark" href="{{ return_url }}">完了</a></p>
      </div>
    </div>
  </section>
{% endblock %}
