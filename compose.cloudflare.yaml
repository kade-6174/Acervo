services:
  proxy:
    volumes:
      - ./deploy/Caddyfile.cloudflare:/etc/caddy/Caddyfile:ro
      - ./deploy/Caddyfile.common:/etc/caddy/Caddyfile.common:ro

  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate run
    env_file:
      - .env.cloudflare
    networks:
      - frontend
    depends_on:
      proxy:
        condition: service_healthy
    tmpfs:
      - /tmp

networks:
  frontend:
