name: 品質確認

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: acervo_test
          POSTGRES_USER: acervo
          POSTGRES_PASSWORD: acervo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acervo -d acervo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: testserver
      ACERVO_TEST_DATABASE: postgresql
      POSTGRES_DB: acervo_test
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: acervo-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存関係をインストール
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: コード品質を確認
        run: |
          ruff check .
          ruff format --check .

      - name: Django設定を確認
        run: python manage.py check --settings=config.settings.test

      - name: PostgreSQLへ接続してマイグレーション
        run: python manage.py migrate --noinput --settings=config.settings.test

      - name: テストを実行
        run: python manage.py test --settings=config.settings.test

  production-container:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: 検証用の本番設定を準備
        run: |
          cp .env.production.example .env.production
          cp .env.cloudflare.example .env.cloudflare
          sed -i 's/acervo\.example\.org/acervo.localhost/g' .env.production
          python3 - <<'PY'
          import base64
          import secrets

          try:
              from cryptography.fernet import Fernet
              key = Fernet.generate_key().decode("ascii")
          except ImportError:
              key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode("ascii")

          with open(".env.production", "r", encoding="utf-8") as f:
              content = f.read()

          content = content.replace(
              "replace-with-comma-separated-fernet-keys-generated-for-this-instance",
              key,
          )

          with open(".env.production", "w", encoding="utf-8") as f:
              f.write(content)
          PY


      - name: Compose設定を検証
        run: |
          docker compose -f compose.production.yaml config --quiet
          docker compose -f compose.production.yaml -f compose.cloudflare.yaml config --quiet

      - name: Caddy設定を変換・検証
        run: |
          docker compose -f compose.production.yaml run --rm --no-deps --entrypoint caddy proxy adapt --config /etc/caddy/Caddyfile --validate
          docker compose -f compose.production.yaml run --rm --no-deps --entrypoint caddy proxy validate --config /etc/caddy/Caddyfile

      - name: 本番イメージをビルド
        run: docker compose -f compose.production.yaml build web

      - name: 本番サービスを起動
        run: docker compose -f compose.production.yaml up --detach --wait db web proxy

      - name: ヘルス状態を確認
        run: |
          test "$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.production.yaml ps -q db)")" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.production.yaml ps -q web)")" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.production.yaml ps -q proxy)")" = "healthy"

      - name: 非root実行と本番設定を確認
        run: |
          test "$(docker compose -f compose.production.yaml exec -T web id -u)" = "10001"
          docker compose -f compose.production.yaml exec -T web python manage.py check --deploy
          docker compose -f compose.production.yaml exec -T web python manage.py shell -c "from django.conf import settings; cache = settings.CACHES['default']; assert cache['BACKEND'] == 'django.core.cache.backends.db.DatabaseCache'; assert cache['LOCATION'] == 'acervo_rate_limit_cache'"

      - name: Caddy経由のHTTP応答を確認
        run: |
          docker compose -f compose.production.yaml exec -T web python - <<'PY'
          import urllib.error
          import urllib.request

          base_url = "http://proxy:8080"
          headers = {"Host": "acervo.localhost"}

          for path in ("/health/", "/static/css/acervo.css", "/accounts/login/"):
              request = urllib.request.Request(f"{base_url}{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=10) as response:
                  assert response.status == 200, (path, response.status)

          try:
              request = urllib.request.Request(f"{base_url}/admin/", headers=headers)
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 404, error.code
          else:
              raise AssertionError("/admin/が404を返しませんでした。")
          PY

      - name: レート制限cache tableを確認
        run: |
          test "$(docker compose -f compose.production.yaml exec -T db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT to_regclass('"'"'public.acervo_rate_limit_cache'"'"');"')" = "acervo_rate_limit_cache"

      - name: 直接HTTPSとTunnelのクライアントIP境界を確認
        run: |
          docker compose -f compose.production.yaml exec -T web python manage.py shell <<'PY'
          import http.client
          import re
          import socket
          import ssl
          import urllib.parse

          from django.db import connection


          class DirectHttpsConnection(http.client.HTTPSConnection):
              def __init__(self):
                  super().__init__(
                      "acervo.localhost",
                      timeout=10,
                      context=ssl._create_unverified_context(),
                  )

              def connect(self):
                  socket_connection = socket.create_connection(("proxy", 443), self.timeout)
                  self.sock = self._context.wrap_socket(
                      socket_connection,
                      server_hostname="acervo.localhost",
                  )


          def login_attempt(connection, headers):
              path = "/accounts/login/"
              connection.request("GET", path, headers=headers)
              response = connection.getresponse()
              assert response.status == 200, response.status
              body = response.read().decode()
              cookies = "; ".join(
                  value.split(";", 1)[0]
                  for name, value in response.getheaders()
                  if name.lower() == "set-cookie"
              )
              csrf_token = re.search(
                  r'name="csrfmiddlewaretoken" value="([^"]+)"', body
              ).group(1)
              data = urllib.parse.urlencode(
                  {
                      "csrfmiddlewaretoken": csrf_token,
                      "login": "missing-user",
                      "password": "wrong-password",
                  }
              ).encode()
              post_headers = {
                  **headers,
                  "Cookie": cookies,
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Origin": "https://acervo.localhost",
              }
              connection.request("POST", path, body=data, headers=post_headers)
              response = connection.getresponse()
              assert response.status == 200, response.status
              response.read()
              connection.close()


          def login_ip_keys():
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT cache_key FROM acervo_rate_limit_cache "
                      "WHERE cache_key LIKE %s",
                      ["%:allauth:rl:login:ip:%"],
                  )
                  return [row[0] for row in cursor.fetchall()]


          def clear_cache_table():
              with connection.cursor() as cursor:
                  cursor.execute("DELETE FROM acervo_rate_limit_cache")


          spoofed_headers = {
              "Host": "acervo.localhost",
              "X-Acervo-Client-IP": "203.0.113.90",
              "X-Forwarded-For": "203.0.113.91",
              "CF-Connecting-IP": "203.0.113.92",
          }

          clear_cache_table()
          login_attempt(DirectHttpsConnection(), spoofed_headers)
          direct_keys = login_ip_keys()
          assert len(direct_keys) == 1, direct_keys
          assert all("203.0.113." not in key for key in direct_keys), direct_keys

          clear_cache_table()
          tunnel_headers = {
              **spoofed_headers,
              "CF-Connecting-IP": "198.51.100.40",
          }
          login_attempt(http.client.HTTPConnection("proxy", 8080, timeout=10), tunnel_headers)
          tunnel_keys = login_ip_keys()
          assert len(tunnel_keys) == 1, tunnel_keys
          assert tunnel_keys[0].endswith(":198.51.100.40"), tunnel_keys
          assert all("203.0.113." not in key for key in tunnel_keys), tunnel_keys
          PY

      - name: アプリとDBのポート非公開を確認
        run: |
          web_id="$(docker compose -f compose.production.yaml ps -q web)"
          db_id="$(docker compose -f compose.production.yaml ps -q db)"
          test -z "$(docker inspect --format='{{with index .HostConfig.PortBindings "8000/tcp"}}published{{end}}' "$web_id")"
          test -z "$(docker inspect --format='{{with index .HostConfig.PortBindings "5432/tcp"}}published{{end}}' "$db_id")"

      - name: DBデータの永続化を確認
        run: |
          docker compose -f compose.production.yaml exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE ci_persistence_check (value text NOT NULL); INSERT INTO ci_persistence_check VALUES ('\''retained'\'');"'
          docker compose -f compose.production.yaml up --detach --force-recreate --wait db
          test "$(docker compose -f compose.production.yaml exec -T db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT value FROM ci_persistence_check;"')" = "retained"

      - name: 写真ボリュームの永続化を確認
        run: |
          docker compose -f compose.production.yaml exec -T web sh -c 'printf %s retained > /app/media/ci-persistence-check.txt'
          docker compose -f compose.production.yaml up --detach --force-recreate --no-deps --wait web
          test "$(docker compose -f compose.production.yaml exec -T web cat /app/media/ci-persistence-check.txt)" = "retained"

      - name: コンテナログを表示
        if: always()
        run: docker compose -f compose.production.yaml logs --no-color

      - name: 検証用コンテナを削除
        if: always()
        run: docker compose -f compose.production.yaml down --volumes
