name: 品質確認

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: acervo_test
          POSTGRES_USER: acervo
          POSTGRES_PASSWORD: acervo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acervo -d acervo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: testserver
      ACERVO_TEST_DATABASE: postgresql
      POSTGRES_DB: acervo_test
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: acervo-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存関係をインストール
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: コード品質を確認
        run: |
          ruff check .
          ruff format --check .

      - name: Django設定を確認
        run: python manage.py check --settings=config.settings.test

      - name: PostgreSQLへ接続してマイグレーション
        run: python manage.py migrate --noinput --settings=config.settings.test

      - name: テストを実行
        run: python manage.py test --settings=config.settings.test

  production-container:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: 検証用の本番設定を準備
        run: |
          cp .env.production.example .env.production
          cp .env.cloudflare.example .env.cloudflare

      - name: Compose設定を検証
        run: |
          docker compose -f compose.production.yaml config --quiet
          docker compose -f compose.production.yaml -f compose.cloudflare.yaml config --quiet

      - name: 本番イメージをビルド
        run: docker compose -f compose.production.yaml build web

      - name: 本番サービスを起動
        run: docker compose -f compose.production.yaml up --detach --wait db web proxy

      - name: ヘルス状態を確認
        run: |
          test "$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.production.yaml ps -q db)")" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.production.yaml ps -q web)")" = "healthy"
          test "$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose -f compose.production.yaml ps -q proxy)")" = "healthy"

      - name: 非root実行と本番設定を確認
        run: |
          test "$(docker compose -f compose.production.yaml exec -T web id -u)" = "10001"
          docker compose -f compose.production.yaml exec -T web python manage.py check --deploy

      - name: Caddy経由のHTTP応答を確認
        run: |
          docker compose -f compose.production.yaml exec -T web python - <<'PY'
          import urllib.error
          import urllib.request

          base_url = "http://proxy:8080"
          headers = {"Host": "acervo.example.org"}

          for path in ("/health/", "/static/css/acervo.css"):
              request = urllib.request.Request(f"{base_url}{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=10) as response:
                  assert response.status == 200, (path, response.status)

          try:
              request = urllib.request.Request(f"{base_url}/admin/", headers=headers)
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 404, error.code
          else:
              raise AssertionError("/admin/が404を返しませんでした。")
          PY

      - name: アプリとDBのポート非公開を確認
        run: |
          test -z "$(docker compose -f compose.production.yaml port web 8000 2>/dev/null)"
          test -z "$(docker compose -f compose.production.yaml port db 5432 2>/dev/null)"

      - name: DBデータの永続化を確認
        run: |
          docker compose -f compose.production.yaml exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE ci_persistence_check (value text NOT NULL); INSERT INTO ci_persistence_check VALUES ('\''retained'\'');"'
          docker compose -f compose.production.yaml up --detach --force-recreate --wait db
          test "$(docker compose -f compose.production.yaml exec -T db sh -c 'psql -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT value FROM ci_persistence_check;"')" = "retained"

      - name: 写真ボリュームの永続化を確認
        run: |
          docker compose -f compose.production.yaml exec -T web sh -c 'printf %s retained > /app/media/ci-persistence-check.txt'
          docker compose -f compose.production.yaml up --detach --force-recreate --no-deps --wait web
          test "$(docker compose -f compose.production.yaml exec -T web cat /app/media/ci-persistence-check.txt)" = "retained"

      - name: コンテナログを表示
        if: always()
        run: docker compose -f compose.production.yaml logs --no-color

      - name: 検証用コンテナを削除
        if: always()
        run: docker compose -f compose.production.yaml down --volumes
