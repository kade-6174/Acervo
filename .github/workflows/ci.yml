name: 品質確認

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: acervo_test
          POSTGRES_USER: acervo
          POSTGRES_PASSWORD: acervo-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acervo -d acervo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: testserver
      ACERVO_TEST_DATABASE: postgresql
      POSTGRES_DB: acervo_test
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: acervo-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 依存関係をインストール
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: コード品質を確認
        run: |
          ruff check .
          ruff format --check .

      - name: Django設定を確認
        run: python manage.py check --settings=config.settings.test

      - name: PostgreSQLへ接続してマイグレーション
        run: python manage.py migrate --noinput --settings=config.settings.test

      - name: テストを実行
        run: python manage.py test --settings=config.settings.test

  production-container:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: 検証用の本番設定を準備
        run: |
          cp .env.production.example .env.production
          cp .env.cloudflare.example .env.cloudflare
          sed -i 's/acervo\.example\.org/acervo.localhost/g' .env.production
          python3 - <<'PY'
          import base64
          import secrets

          try:
              from cryptography.fernet import Fernet
              key = Fernet.generate_key().decode("ascii")
          except ImportError:
              key = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode("ascii")

          with open(".env.production", "r", encoding="utf-8") as f:
              content = f.read()

          content = content.replace(
              "replace-with-comma-separated-fernet-keys-generated-for-this-instance",
              key,
          )

          with open(".env.production", "w", encoding="utf-8") as f:
              f.write(content)
          PY
          echo 'ACERVO_CI_CSRF_DIAGNOSTICS=1' >> .env.production


      - name: 直接HTTPS構成を検証
        run: bash .github/scripts/verify-production-compose.sh direct

      - name: Tunnel専用構成を検証
        run: bash .github/scripts/verify-production-compose.sh cloudflare

      - name: 暗号化バックアップと空環境復元を検証
        run: bash .github/scripts/verify-backup-restore.sh
