{% extends "base.html" %}
{% block title %}分類を手入力で登録 | {{ acervo_site_name }}{% endblock %}
{% block content %}
<section class="container py-4" style="max-width: 42rem;">
  <h1 class="h3">分類を手入力で登録</h1>
  <p class="text-secondary">外部候補の有無にかかわらず、学名または和名を登録できます。</p>
  <form method="post" class="vstack gap-3">{% csrf_token %}{% for field in form %}<div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}{{ form.non_field_errors }}<button class="btn btn-primary" type="submit">登録</button></form>
</section>
{% endblock %}
