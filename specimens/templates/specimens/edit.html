{% extends "base.html" %}
{% block title %}標本を編集 | {{ acervo_site_name }}{% endblock %}
{% block content %}<section class="container py-4" style="max-width:42rem"><h1 class="h3">{{ specimen.specimen_code }}を編集</h1><p><a href="{% url 'specimens:taxon_search' %}">分類候補を検索・登録する</a></p><form method="post" class="vstack gap-3">{% csrf_token %}{% for field in form %}<div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary" type="submit">保存</button></form></section>{% endblock %}
