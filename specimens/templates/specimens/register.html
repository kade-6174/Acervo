{% extends "base.html" %}
{% block title %}標本登録 | {{ acervo_site_name }}{% endblock %}
{% block content %}
<section class="container py-4" style="max-width: 42rem;">
  <h1 class="h3">標本登録</h1>
  <p class="text-secondary">標本番号は確定ボタンを押すまで発行されません。</p>
  <form method="post" enctype="multipart/form-data" class="vstack gap-3">
    {% csrf_token %}
    {% for field in form %}<div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
    <button class="btn btn-primary" type="submit">確認画面へ進む</button>
  </form>
</section>
{% endblock %}
