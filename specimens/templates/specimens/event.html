{% extends "base.html" %}
{% block title %}履歴を追加 | {{ acervo_site_name }}{% endblock %}
{% block content %}<section class="container py-4" style="max-width:42rem"><h1 class="h3">{{ specimen.specimen_code }}の履歴を追加</h1><form method="post" class="vstack gap-3">{% csrf_token %}{% for field in form %}<div><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary" type="submit">履歴を追加</button></form></section>{% endblock %}
