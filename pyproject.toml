[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acervo"
version = "0.1.0"
description = "標本・収蔵品・アーカイブを管理するセルフホスト型コレクション管理システム"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
    "static/vendor/bootstrap/LICENSE",
    "static/vendor/htmx/LICENSE",
    "static/vendor/jsqr/LICENSE",
]
authors = [{ name = "kade_6174" }]
dependencies = [
    "Django==5.2.17",
    "cryptography==50.0.1",
    "django-allauth[mfa]==65.19.3",
    "django-environ==0.14.0",
    "gunicorn==26.2.0",
    "psycopg[binary]==3.3.5",
    "Pillow==12.3.0",
    "qrcode==8.2",
    "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
include = ["accounts*", "audit*", "config*", "core*", "management_portal*", "specimens*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"*/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
