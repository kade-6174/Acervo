{% extends "base.html" %}

{% block title %}認証アプリの無効化 — Acervo{% endblock %}

{% block content %}
  <section class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="d-flex align-items-center mb-4">
          <a href="{% url 'mfa_index' %}" class="btn btn-outline-secondary btn-sm me-3">← 戻る</a>
          <h1 class="h2 mb-0">認証アプリによる二要素認証を無効にしますか？</h1>
        </div>

        <div class="card shadow-sm border-danger">
          <div class="card-body p-4">
            <div class="alert alert-warning mb-4" role="alert">
              <h2 class="h6 alert-heading fw-bold mb-2">警告</h2>
              <p class="mb-0 small">認証アプリによる二要素認証を無効化すると、アカウントのセキュリティ強度が低下します。本当に無効化してもよろしいですか？</p>
            </div>

            <form method="post" action="{% url 'mfa_deactivate_totp' %}" novalidate>
              {% csrf_token %}
              {% if form.non_field_errors %}
                <div class="alert alert-danger py-2 small" role="alert">
                  {{ form.non_field_errors }}
                </div>
              {% endif %}

              <div class="d-grid gap-2 mt-4">
                <button class="btn btn-danger btn-lg" type="submit">認証アプリを無効化する</button>
                <a href="{% url 'mfa_index' %}" class="btn btn-outline-secondary">キャンセル</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
