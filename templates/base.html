{% load static %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="標本・収蔵品・アーカイブを管理するAcervo">
    <title>{% block title %}Acervo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/acervo.css' %}">
    <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
  </head>
  <body>
    <header class="border-bottom bg-white">
      <nav class="container py-3 d-flex align-items-center justify-content-between" aria-label="メインナビゲーション">
        <a class="fs-4 fw-semibold text-decoration-none text-dark" href="{% url 'core:home' %}">Acervo</a>
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-secondary" type="submit">ログアウト</button>
          </form>
        {% else %}
          <a class="btn btn-outline-primary" href="{% url 'account_login' %}">ログイン</a>
        {% endif %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
