{% load static %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="標本・収蔵品・アーカイブを管理するAcervo">
    <title>{% block title %}{{ acervo_site_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/acervo.css' %}">
    <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
  </head>
  <body>
    <header class="border-bottom bg-white">
      <nav class="container py-3 d-flex flex-wrap gap-3 align-items-center justify-content-between" aria-label="メインナビゲーション">
        <a class="fs-4 fw-semibold text-decoration-none text-dark" href="{% url 'core:home' %}">{{ acervo_site_name }}</a>
        {% if user.is_authenticated %}
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <a class="btn btn-outline-secondary" href="{% url 'mfa_index' %}">セキュリティ設定</a>
            {% if user.role == "admin" %}<a class="btn btn-outline-dark" href="{% url 'management:index' %}">管理</a>{% endif %}
            <form method="post" action="{% url 'account_logout' %}">
              {% csrf_token %}
              <button class="btn btn-outline-secondary" type="submit">ログアウト</button>
            </form>
          </div>
        {% else %}
          <a class="btn btn-outline-primary" href="{% url 'account_login' %}">ログイン</a>
        {% endif %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    {% block extra_body %}{% endblock %}
  </body>
</html>
