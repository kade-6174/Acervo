{% extends "base.html" %}

{% block title %}ホーム | {{ acervo_site_name }}{% endblock %}

{% block content %}
  <section class="container py-5" style="max-width: 56rem;">
    <h1 class="h2 mb-3">{{ acervo_site_name }}</h1>
    <p class="lead text-secondary">標本の登録・検索・履歴を管理します。</p>
    <div class="d-grid gap-3 d-sm-flex mt-4">
      {% if can_scan %}<a class="btn btn-dark btn-lg" href="{% url 'core:qr_scan' %}">QRコードを読み取る</a>{% endif %}
      <a class="btn btn-outline-dark btn-lg" href="{% url 'specimens:list' %}">標本を探す</a>
    </div>
    <p class="text-secondary mt-4 mb-0">スマートフォンのホーム画面に追加して使えます。オフラインでは登録や検索はできません。</p>
  </section>
{% endblock %}
